<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossos Projetos</title>

    <!-- O CSS usa o nome real do arquivo existente na pasta css. -->
    <link rel="stylesheet" href="css/style.css" media="all">
    <script src="js/navigation.js" defer></script>
    <script src="js/theme.js" defer></script>
</head>
<body>
    <!-- Cabeçalho compartilhado entre as páginas, inspirado no layout do Figma. -->
    <header>
        <nav class="navbar">
            <a class="logo-link" href="index.html">
                <img src="imagens/estrela.png" alt="Logo">
            </a>

            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Abrir menu principal">
                <span aria-hidden="true">&#9776;</span>
            </button>

            <div class="nav-links" id="primary-navigation">
                <a class="nav-button" href="index.html">Página Principal</a>
                <a class="nav-button active" href="projetos.html">Projetos</a>
                <a class="nav-button" href="cadastro.html">Quero Ajudar</a>
                <button class="nav-button theme-toggle" type="button" aria-pressed="false">Modo escuro</button>
            </div>
        </nav>
    </header>
    <main>
        <!-- Os três projetos usam as imagens fornecidas para reproduzir os cartões do Figma. -->
        <section id="lista-projetos" class="project-grid" aria-label="Projetos atuais">
            <article class="project-card">
                <img src="imagens/projeto A.png" alt="Voluntária acompanhando um idoso com andador">
                <div class="project-content">
                    <span class="feedback-badge feedback-badge--new">Novo</span>
                    <h1>Projetos A</h1>
                    <p>Descrição do Projeto A.</p>
                </div>
            </article>
            <article class="project-card">
                <img src="imagens/projeto B.png" alt="Professora ensinando crianças em uma sala de aula">
                <div class="project-content">
                    <span class="feedback-badge feedback-badge--pending">Pendente</span>
                    <h1>Projetos B</h1>
                    <p>Descrição do Projeto B.</p>
                </div>
            </article>
            <article class="project-card">
                <img src="imagens/projeto C.png" alt="Voluntário cuidando de um cachorro">
                <div class="project-content">
                    <span class="feedback-badge feedback-badge--complete">Concluído</span>
                    <h1>Projetos C</h1>
                    <p>Descrição do Projeto C.</p>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
